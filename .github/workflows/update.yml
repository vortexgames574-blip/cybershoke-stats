name: Auto Update Stats

on:
  schedule:
    # Запускать каждый день в 03:00 ночи по МСК
    - cron: '0 0 * * *'
  workflow_dispatch: # Позволяет запускать вручную кнопкой на GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Устанавливаем зависимости
        run: npm ci

      - name: Устанавливаем Playwright и Chromium
        run: npx playwright install --with-deps chromium

      - name: Собираем новые матчи
        run: npm run update

      - name: Коммитим изменения
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add docs/data/stats.json data/matches/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stats.json [skip ci]" && git push)