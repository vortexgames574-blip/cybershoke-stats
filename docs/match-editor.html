<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор матчей GEIMERI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-card: #151a25;
      --text-main: #f0f3f8;
      --text-muted: #8b96a5;
      --accent: #4d6bfe;
      --border: #262f40;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; background: var(--bg-card); }
    .drop-zone:hover { border-color: var(--accent); background: rgba(77, 107, 254, 0.05); }
    .drop-zone p { color: var(--text-muted); margin-top: 10px; }
    .editor-area { display: none; margin-top: 20px; }
    .match-header { background: var(--bg-card); padding: 15px 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px 15px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
    input[type="number"] { width: 70px; background: var(--bg-main); border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 4px; text-align: center; font-family: inherit; }
    input[type="number"]:focus { outline: none; border-color: var(--accent); }
    .btn { background: var(--accent); color: #fff; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; font-size: 1rem; margin-top: 20px; }
    .btn:hover { background: #6b84ff; }
    .btn-save { background: #10b981; }
    .btn-save:hover { background: #059669; }
    .player-name { font-weight: 600; }
    .map-title { color: var(--accent); font-size: 1.2rem; font-weight: 700; margin: 20px 0 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="margin-bottom: 10px;">Визуальный редактор матчей</h1>
    <p style="color: var(--text-muted); margin-bottom: 20px;">Исправляй баги API Cybershoke (смерти, фраги) прямо в браузере, без текстовых документов.</p>

    <!-- Зона загрузки -->
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      <h3>Перетащи сюда JSON-файл матча</h3>
      <p>или нажми, чтобы выбрать файл (например, 13354491.json из папки data/matches)</p>
    </div>
    <input type="file" id="file-input" accept=".json" style="display: none;" onchange="handleFile(this.files[0])">

    <!-- Редактор -->
    <div class="editor-area" id="editor-area">
      <div class="match-header">
        <div>
          <h3 id="match-title">Загрузка...</h3>
          <span style="color: var(--text-muted); font-size: 0.85rem;" id="match-url"></span>
        </div>
        <button class="btn btn-save" onclick="downloadJson()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Сохранить и скачать JSON
        </button>
      </div>
      <div id="maps-container"></div>
    </div>
  </div>

  <script>
    let currentData = null;
    let currentFileName = 'match.json';

    function handleFile(file) {
      if (!file) return;
      currentFileName = file.name;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          currentData = JSON.parse(e.target.result);
          renderEditor();
        } catch (err) {
          alert('Ошибка чтения JSON: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    function renderEditor() {
      document.getElementById('drop-zone').style.display = 'none';
      document.getElementById('editor-area').style.display = 'block';
      
      document.getElementById('match-title').innerText = 'Матч: ' + currentData.matchId;
      document.getElementById('match-url').innerText = currentData.tournament || 'Без турнира';

      const container = document.getElementById('maps-container');
      container.innerHTML = '';

      currentData.maps.forEach((map, mapIndex) => {
        const mapDiv = document.createElement('div');
        
        let rowsHtml = map.players.map((p, pIndex) => `
          <tr>
            <td class="player-name">${p.name || 'Unknown'}</td>
            <td><input type="number" value="${p.kills}" onchange="updateStat(${mapIndex}, ${pIndex}, 'kills', this.value)"></td>
            <td><input type="number" value="${p.deaths}" onchange="updateStat(${mapIndex}, ${pIndex}, 'deaths', this.value)"></td>
            <td><input type="number" value="${p.assists}" onchange="updateStat(${mapIndex}, ${pIndex}, 'assists', this.value)"></td>
            <td><input type="number" value="${p.adr || 0}" onchange="updateStat(${mapIndex}, ${pIndex}, 'adr', this.value)"></td>
            <td><input type="number" value="${p.kast || 0}" onchange="updateStat(${mapIndex}, ${pIndex}, 'kast', this.value)"></td>
            <td><input type="number" step="0.01" value="${p.rating || 0}" onchange="updateStat(${mapIndex}, ${pIndex}, 'rating', this.value)"></td>
          </tr>
        `).join('');

        mapDiv.innerHTML = `
          <div class="map-title">Карта: ${map.map}</div>
          <table>
            <thead>
              <tr>
                <th>Игрок</th>
                <th>K</th>
                <th>D</th>
                <th>A</th>
                <th>ADR</th>
                <th>KAST</th>
                <th>Rating</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        `;
        container.appendChild(mapDiv);
      });
    }

    function updateStat(mapIndex, playerIndex, field, value) {
      currentData.maps[mapIndex].players[playerIndex][field] = parseFloat(value);
    }

    function downloadJson() {
      const dataStr = JSON.stringify(currentData, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = currentFileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
